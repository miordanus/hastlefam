<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>HastleFam — Регулярные платежи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --bg:#09090b; --surface:#141417; --surface2:#1a1a1f; --border:#27272a; --border2:#3f3f46;
  --text:#e4e4e7; --muted:#71717a; --subtle:#52525b; --accent:#6366f1;
  --green:#22c55e; --red:#ef4444; --yellow:#f59e0b; --radius:10px;
}
body { background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; font-size:14px; line-height:1.5; min-height:100dvh; -webkit-font-smoothing:antialiased; }
.mono { font-family:'JetBrains Mono','Fira Code',monospace; font-variant-numeric:tabular-nums; }
a { color:inherit; text-decoration:none; }
.h-root { position:sticky; top:0; z-index:50; background:rgba(9,9,11,0.92); backdrop-filter:blur(12px); border-bottom:1px solid #1f1f23; }
.h-inner { max-width:1120px; margin:0 auto; padding:0 20px; height:52px; display:flex; align-items:center; gap:12px; }
.h-brand { display:flex; align-items:center; gap:8px; }
.h-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); }
.h-name { font-size:14px; font-weight:600; letter-spacing:0.03em; color:#fff; }
.h-right { margin-left:auto; display:flex; align-items:center; gap:14px; }
.h-link { font-size:12px; color:var(--muted); }
.h-link:hover { color:var(--text); }
.h-link.active { color:var(--text); }
.container { max-width:1120px; margin:0 auto; padding:24px 20px 64px; display:flex; flex-direction:column; gap:18px; }
.hero-label { font-size:12px; font-weight:500; color:var(--muted); letter-spacing:0.08em; text-transform:uppercase; }
.panel { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
.panel-head { padding:13px 18px; border-bottom:1px solid #1f1f23; font-size:13px; font-weight:600; color:#a1a1aa; display:flex; align-items:center; gap:8px; }
.panel-empty { padding:18px; font-size:13px; color:var(--subtle); }
table { width:100%; border-collapse:collapse; }
th { text-align:left; font-size:11px; color:var(--subtle); font-weight:500; text-transform:uppercase; letter-spacing:0.05em; padding:9px 18px; border-bottom:1px solid #1f1f23; }
td { padding:11px 18px; font-size:13px; border-bottom:1px solid var(--surface2); }
tr:last-child td { border-bottom:none; }
.t-name { color:var(--text); }
.t-num { color:#a1a1aa; }
.form { display:flex; flex-wrap:wrap; gap:10px; padding:16px 18px; align-items:flex-end; }
.field { display:flex; flex-direction:column; gap:4px; }
.field label { font-size:11px; color:var(--subtle); text-transform:uppercase; letter-spacing:0.05em; }
input, select { background:var(--surface2); border:1px solid var(--border2); border-radius:8px; color:var(--text); font-size:13px; padding:8px 10px; font-family:inherit; }
input:focus, select:focus { outline:none; border-color:var(--accent); }
.btn { background:var(--accent); border:none; border-radius:8px; color:#fff; font-size:13px; font-weight:500; padding:9px 16px; cursor:pointer; font-family:inherit; }
.btn:hover { filter:brightness(1.1); }
.btn-gray { background:var(--surface2); border:1px solid var(--border2); color:var(--muted); padding:5px 10px; font-size:12px; }
.btn-gray:hover { color:var(--text); }
.note { padding:0 18px 16px; font-size:12px; color:var(--subtle); }
</style>
</head>
<body>
<div class="h-root"><div class="h-inner">
  <div class="h-brand"><span class="h-dot"></span><span class="h-name">HastleFam</span></div>
  <div class="h-right">
    <a class="h-link" href="/finance/health?household_id={{ household_id or '' }}">Здоровье</a>
    <a class="h-link" href="/finance/report?household_id={{ household_id or '' }}">Отчёт</a>
    <a class="h-link" href="/finance/planned?household_id={{ household_id or '' }}">Планы</a>
    <a class="h-link" href="/finance/quality?household_id={{ household_id or '' }}">Качество</a>
    <a class="h-link" href="/finance/accounts?household_id={{ household_id or '' }}">Счета</a>
    <a class="h-link active" href="/finance/recurring?household_id={{ household_id or '' }}">Регулярные</a>
    <a class="h-link" href="/auth/logout">Выйти</a>
  </div>
</div></div>

<div class="container" id="root">
  <div class="panel-empty">Загрузка…</div>
</div>

<script type="application/json" id="rec-data">{{ recurring_data | tojson }}</script>
<script type="application/json" id="hid-data">{{ (household_id or '') | tojson }}</script>
<script>
const D = (() => { try { return JSON.parse(document.getElementById('rec-data').textContent || 'null'); } catch(e){ return null; } })();
const HID = (() => { try { return JSON.parse(document.getElementById('hid-data').textContent || '""'); } catch(e){ return ''; } })();
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtAmt = (a,c) => a==null ? '—' : `${Number(a).toLocaleString('ru-RU')} ${String(c||'').toUpperCase()}`;
const fmtDate = iso => { if(!iso) return '—'; try { return new Date(iso).toLocaleDateString('ru-RU',{day:'2-digit',month:'short'}); } catch(e){ return '—'; } };

async function addRec(){
  const title = document.getElementById('f-title').value.trim();
  const amount = document.getElementById('f-amount').value.replace(',', '.').trim();
  const currency = document.getElementById('f-cur').value;
  const day = parseInt(document.getElementById('f-day').value, 10);
  if(!title){ alert('Укажи название'); return; }
  if(!isFinite(Number(amount)) || Number(amount) <= 0){ alert('Сумма должна быть положительной'); return; }
  if(!(day >= 1 && day <= 31)){ alert('День месяца: 1–31'); return; }
  try {
    const r = await fetch('/finance/recurring', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({household_id: HID, title, amount, currency, day_of_month: day}),
    });
    if(!r.ok){ alert('Не удалось добавить — '+r.status); return; }
    location.reload();
  } catch(e){ alert('Ошибка: '+e.message); }
}

async function deactivate(id, title){
  if(!confirm(`Деактивировать «${title}»?`)) return;
  try {
    const r = await fetch(`/finance/recurring/${id}/deactivate`, {method:'POST'});
    if(!r.ok){ alert('Не удалось — '+r.status); return; }
    location.reload();
  } catch(e){ alert('Ошибка: '+e.message); }
}

function render(){
  const root = document.getElementById('root');
  if(!D){ root.innerHTML = '<div class="panel-empty">Нет household_id — данные не загружены.</div>'; return; }
  const items = D.items || [];
  const curOpts = ['RUB','USD','USDT','EUR','AMD'].map(c=>`<option value="${c}">${c}</option>`).join('');

  const form = `<div class="panel">
    <div class="panel-head">Добавить регулярный платёж</div>
    <div class="form">
      <div class="field"><label>Название</label><input id="f-title" placeholder="Аренда" style="min-width:180px"></div>
      <div class="field"><label>Сумма</label><input id="f-amount" placeholder="50000" style="width:120px"></div>
      <div class="field"><label>Валюта</label><select id="f-cur">${curOpts}</select></div>
      <div class="field"><label>День месяца</label><input id="f-day" type="number" min="1" max="31" placeholder="5" style="width:90px"></div>
      <button class="btn" onclick="addRec()">Добавить</button>
    </div>
    <div class="note">Ежемесячно. За ~3 дня до даты бот создаёт плановую операцию и напоминает. Эти платежи питают «обязательства» и запас в Чёткой картине.</div>
  </div>`;

  const rows = items.map(it => `<tr>
    <td class="t-name">${esc(it.title)}</td>
    <td class="t-num mono">${fmtAmt(it.amount_expected, it.currency)}</td>
    <td class="t-num">${it.day_of_month!=null?('каждое '+it.day_of_month+'-е'):'—'}</td>
    <td class="t-num">${fmtDate(it.next_due_date)}</td>
    <td><button class="btn-gray" onclick="deactivate('${esc(it.id)}','${esc(it.title)}')">деактивировать</button></td>
  </tr>`).join('');
  const list = `<div class="panel">
    <div class="panel-head">Активные регулярные платежи <span class="t-num" style="margin-left:auto">${items.length}</span></div>
    ${items.length ? `<table><thead><tr><th>Название</th><th>Сумма</th><th>Когда</th><th>Следующий</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
      : '<div class="panel-empty">Пока нет регулярных платежей. Добавь аренду, подписки и регулярные счета — тогда расчёт запаса перестанет угадывать.</div>'}
  </div>`;

  root.innerHTML = `<div class="hero-label">Регулярные платежи</div>` + form + list;
}
render();
</script>
</body>
</html>
