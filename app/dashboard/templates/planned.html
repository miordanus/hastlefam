<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>HastleFam — Планы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --bg:#09090b; --surface:#141417; --surface2:#1a1a1f; --border:#27272a; --border2:#3f3f46;
  --text:#e4e4e7; --muted:#71717a; --subtle:#52525b; --accent:#6366f1;
  --green:#22c55e; --red:#ef4444; --yellow:#f59e0b; --radius:10px;
}
body { background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; font-size:14px; line-height:1.5; min-height:100dvh; -webkit-font-smoothing:antialiased; }
.mono { font-family:'JetBrains Mono','Fira Code',monospace; font-variant-numeric:tabular-nums; }
a { color:inherit; text-decoration:none; }
.h-root { position:sticky; top:0; z-index:50; background:rgba(9,9,11,0.92); backdrop-filter:blur(12px); border-bottom:1px solid #1f1f23; }
.h-inner { max-width:1120px; margin:0 auto; padding:0 20px; height:52px; display:flex; align-items:center; gap:12px; }
.h-brand { display:flex; align-items:center; gap:8px; }
.h-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); }
.h-name { font-size:14px; font-weight:600; letter-spacing:0.03em; color:#fff; }
.h-right { margin-left:auto; display:flex; align-items:center; gap:14px; }
.h-meta { font-size:12px; color:var(--subtle); }
.h-link { font-size:12px; color:var(--muted); }
.h-link:hover { color:var(--text); }
.container { max-width:1120px; margin:0 auto; padding:24px 20px 64px; display:flex; flex-direction:column; gap:18px; }
.hero { background:linear-gradient(135deg,#141417 0%,#18181e 100%); border:1px solid var(--border); border-radius:14px; padding:22px 26px; }
.hero-label { font-size:12px; font-weight:500; color:var(--muted); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:10px; }
.hero-row { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
.hero-num { font-size:40px; font-weight:600; letter-spacing:-0.02em; line-height:1; }
.hero-cap { font-size:15px; color:#a1a1aa; }
.panel { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
.panel.overdue { border-color:#b45309; }
.panel-head { padding:13px 18px; border-bottom:1px solid #1f1f23; font-size:13px; font-weight:600; color:#a1a1aa; display:flex; align-items:center; gap:8px; }
.panel-empty { padding:18px; font-size:13px; color:var(--subtle); }
table { width:100%; border-collapse:collapse; }
th { text-align:left; font-size:11px; color:var(--subtle); font-weight:500; text-transform:uppercase; letter-spacing:0.05em; padding:9px 18px; border-bottom:1px solid #1f1f23; }
td { padding:11px 18px; font-size:13px; border-bottom:1px solid var(--surface2); vertical-align:middle; }
tr:last-child td { border-bottom:none; }
.t-name { color:var(--text); }
.t-num { color:#a1a1aa; }
.tag { font-size:11px; color:var(--subtle); border:1px solid var(--border2); border-radius:4px; padding:1px 6px; }
.acts { display:flex; gap:6px; justify-content:flex-end; }
.btn { border:none; font-size:12px; padding:4px 9px; border-radius:5px; cursor:pointer; font-family:inherit; font-weight:500; }
.btn-paid { background:rgba(34,197,94,0.12); color:var(--green); }
.btn-paid:hover { background:rgba(34,197,94,0.22); }
.btn-gray { background:rgba(113,113,122,0.15); color:var(--muted); }
.btn-gray:hover { background:rgba(113,113,122,0.25); color:var(--text); }
.inc { color:var(--green); } .exp { color:var(--text); }
@media (max-width:760px){ td .acts { flex-wrap:wrap; } }
/* Edit modal */
.btn-edit { background:rgba(99,102,241,0.15); color:var(--accent); }
.btn-edit:hover { background:rgba(99,102,241,0.28); }
.m-overlay { position:fixed; inset:0; z-index:100; background:rgba(0,0,0,0.6); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; padding:20px; }
.m-overlay.open { display:flex; }
.m-card { width:100%; max-width:440px; background:var(--surface); border:1px solid var(--border2); border-radius:14px; padding:22px; max-height:90dvh; overflow:auto; }
.m-title { font-size:15px; font-weight:600; color:#fff; margin-bottom:16px; }
.f-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.f-field { display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
.f-field.full { grid-column:1 / -1; }
.f-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; }
.f-input, .f-select { width:100%; background:var(--surface2); border:1px solid var(--border2); border-radius:7px; color:var(--text); font-family:inherit; font-size:13px; padding:8px 10px; }
.f-input:focus, .f-select:focus { outline:none; border-color:var(--accent); }
.m-acts { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }
.btn-ghost { background:transparent; color:var(--muted); border:1px solid var(--border2); padding:8px 14px; border-radius:7px; cursor:pointer; font-family:inherit; font-size:13px; }
.btn-ghost:hover { color:var(--text); }
.btn-primary { background:var(--accent); color:#fff; border:none; padding:8px 16px; border-radius:7px; cursor:pointer; font-family:inherit; font-size:13px; font-weight:500; }
.btn-primary:disabled { opacity:0.6; cursor:default; }
</style>
</head>
<body>
<div class="h-root"><div class="h-inner">
  <div class="h-brand"><span class="h-dot"></span><span class="h-name">HastleFam</span></div>
  <div class="h-right">
    <a class="h-link" href="/finance/report?household_id={{ household_id or '' }}">Отчёт</a>
    <a class="h-link" href="/finance/health?household_id={{ household_id or '' }}">Здоровье</a>
    <a class="h-link" href="/finance/quality?household_id={{ household_id or '' }}">Качество</a>
    <a class="h-link" href="/finance/accounts?household_id={{ household_id or '' }}">Счета</a>
    <a class="h-link" href="/finance/recurring?household_id={{ household_id or '' }}">Регулярные</a>
    <a class="h-link" href="/auth/logout">Выйти</a>
  </div>
</div></div>

<script type="application/json" id="planned-data">{{ planned_data | tojson }}</script>
<script type="application/json" id="hid-data">{{ (household_id or '') | tojson }}</script>

<div class="container" id="root"><div class="panel-empty">Загрузка…</div></div>

<div class="m-overlay" id="edit-overlay">
  <div class="m-card">
    <div class="m-title">Изменить операцию</div>
    <div id="edit-body"></div>
  </div>
</div>

<script>
const D = (() => { try { return JSON.parse(document.getElementById('planned-data').textContent || 'null'); } catch(e){ return null; } })();
const HID = (() => { try { return JSON.parse(document.getElementById('hid-data').textContent || '""'); } catch(e){ return ''; } })();
const ACCOUNTS = (D && D.accounts) || [];
const CURRENCIES = ['RUB','USD','USDT','EUR','AMD'];
const DIRECTIONS = [['expense','Расход'],['income','Доход'],['exchange','Обмен'],['transfer','Перевод']];
const BYID = {};

const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtRub = a => `${Math.round(Number(a)||0).toLocaleString('ru-RU')} ₽`;
function fmtNative(a, cur){ return `${Number(a).toLocaleString('ru-RU')} ${String(cur||'').toUpperCase()}`; }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return isNaN(d)?esc(iso):d.toLocaleDateString('ru-RU',{day:'2-digit',month:'short'}); }
function plural(n,one,few,many){ const a=n%10,b=n%100; if(a===1&&b!==11)return one; if(a>=2&&a<=4&&(b<12||b>14))return few; return many; }

async function act(id, action){
  const fd = new FormData(); fd.set('action', action);
  try {
    const r = await fetch(`/finance/transactions/${id}/action`, {method:'POST', body:fd});
    if(!r.ok){ alert('Не удалось — '+r.status); return; }
    setTimeout(()=>location.reload(), 150);
  } catch(e){ alert('Ошибка: '+e.message); }
}
async function reschedule(id, cur){
  const val = prompt('Новая дата (ГГГГ-ММ-ДД):', (cur||'').slice(0,10));
  if(!val) return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(val)){ alert('Формат: ГГГГ-ММ-ДД'); return; }
  try {
    const r = await fetch(`/finance/transactions/${id}/edit`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({occurred_at: val}),
    });
    if(!r.ok){ alert('Не удалось перенести — '+r.status); return; }
    setTimeout(()=>location.reload(), 150);
  } catch(e){ alert('Ошибка: '+e.message); }
}

// ── Full edit (pop-up modal) ──────────────────────────────────────────────
function openEdit(id){
  const it = BYID[id];
  if(!it){ return; }
  const curUp = (it.currency || 'rub').toUpperCase();
  const accOpts = '<option value="">— без счёта —</option>' +
    ACCOUNTS.map(a => `<option value="${a.id}" ${a.id===it.account_id?'selected':''}>${esc(a.name)}</option>`).join('');
  const curOpts = CURRENCIES.map(c => `<option value="${c}" ${c===curUp?'selected':''}>${c}</option>`).join('');
  const dirOpts = DIRECTIONS.map(([v,l]) => `<option value="${v}" ${v===it.direction?'selected':''}>${l}</option>`).join('');
  document.getElementById('edit-body').innerHTML = `
    <div class="f-grid">
      <div class="f-field"><label class="f-label">Сумма</label>
        <input class="f-input mono" id="ed-amount" type="number" step="0.01" value="${it.amount}"></div>
      <div class="f-field"><label class="f-label">Валюта</label>
        <select class="f-select" id="ed-currency">${curOpts}</select></div>
      <div class="f-field"><label class="f-label">Направление</label>
        <select class="f-select" id="ed-direction">${dirOpts}</select></div>
      <div class="f-field"><label class="f-label">Дата</label>
        <input class="f-input mono" id="ed-date" type="date" value="${(it.occurred_at||'').slice(0,10)}"></div>
    </div>
    <div class="f-field full"><label class="f-label">Счёт</label>
      <select class="f-select" id="ed-account">${accOpts}</select></div>
    <div class="f-field full"><label class="f-label">Контрагент</label>
      <input class="f-input" id="ed-merchant" type="text" value="${esc(it.merchant_raw || '')}"></div>
    <div class="f-field full"><label class="f-label">Тег</label>
      <input class="f-input" id="ed-tag" type="text" value="${esc(it.primary_tag || '')}"></div>
    <div class="m-acts">
      <button class="btn-ghost" onclick="closeEdit()">Отмена</button>
      <button class="btn-primary" id="ed-save" onclick="saveEdit('${id}')">Сохранить</button>
    </div>`;
  document.getElementById('edit-overlay').classList.add('open');
}
function closeEdit(){ document.getElementById('edit-overlay').classList.remove('open'); }
async function saveEdit(id){
  const it = BYID[id];
  if(!it){ return; }
  const body = {};
  const amount = parseFloat(document.getElementById('ed-amount').value);
  if(!isNaN(amount) && amount !== Number(it.amount)) body.amount = amount;
  const cur = document.getElementById('ed-currency').value;
  if(cur && cur !== (it.currency || '').toUpperCase()) body.currency = cur;
  const dir = document.getElementById('ed-direction').value;
  if(dir && dir !== it.direction) body.direction = dir;
  const dt = document.getElementById('ed-date').value;
  if(dt && dt !== (it.occurred_at || '').slice(0,10)) body.occurred_at = dt;
  const acc = document.getElementById('ed-account').value;
  if(acc !== (it.account_id || '')) body.account_id = acc;
  const merch = document.getElementById('ed-merchant').value.trim();
  if(merch !== (it.merchant_raw || '')) body.merchant = merch;
  const tag = document.getElementById('ed-tag').value.trim();
  if(tag !== (it.primary_tag || '')) body.primary_tag = tag;
  if(Object.keys(body).length === 0){ closeEdit(); return; }
  const btn = document.getElementById('ed-save');
  if(btn){ btn.disabled = true; btn.textContent = 'Сохранение…'; }
  try {
    const r = await fetch(`/finance/transactions/${id}/edit`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body),
    });
    if(!r.ok){
      alert(r.status === 423 ? 'Месяц закрыт — изменение заблокировано' : 'Не удалось — '+r.status);
      if(btn){ btn.disabled = false; btn.textContent = 'Сохранить'; }
      return;
    }
    setTimeout(()=>location.reload(), 150);
  } catch(e){ alert('Ошибка: '+e.message); if(btn){ btn.disabled = false; btn.textContent = 'Сохранить'; } }
}

function row(it){
  const isNative = it.currency && it.currency.toLowerCase() !== 'rub';
  const sign = it.direction === 'income' ? '+' : '−';
  const amt = isNative
    ? `${fmtNative(it.amount, it.currency)} <span class="t-num">(${fmtRub(it.amount_rub)})</span>`
    : fmtRub(it.amount);
  return `<tr>
    <td class="t-num">${fmtDate(it.occurred_at)}</td>
    <td class="t-name">${esc(it.merchant_raw) || '—'}${it.primary_tag?` <span class="tag">${esc(it.primary_tag)}</span>`:''}</td>
    <td class="t-num">${esc(it.account_name)||'—'}</td>
    <td class="mono ${it.direction==='income'?'inc':'exp'}">${sign}${amt}</td>
    <td><div class="acts">
      <button class="btn btn-paid" onclick="act('${it.id}','paid')">✓ Оплачено</button>
      <button class="btn btn-gray" onclick="reschedule('${it.id}','${it.occurred_at}')">🗓 Перенести</button>
      <button class="btn btn-edit" onclick="openEdit('${it.id}')">✎ Изменить</button>
      <button class="btn btn-gray" onclick="act('${it.id}','skip')">✕ Пропустить</button>
    </div></td>
  </tr>`;
}

function panel(title, items, totalRub, extraClass){
  const head = `<div class="panel-head">${title} <span class="t-num" style="margin-left:auto">${items.length} · ${fmtRub(totalRub)}</span></div>`;
  if(!items.length) return `<div class="panel ${extraClass||''}">${head}<div class="panel-empty">пусто</div></div>`;
  return `<div class="panel ${extraClass||''}">${head}
    <table><thead><tr><th>Дата</th><th>Что</th><th>Счёт</th><th>Сумма</th><th></th></tr></thead>
    <tbody>${items.map(row).join('')}</tbody></table></div>`;
}

function render(){
  const root = document.getElementById('root');
  if(!D){ root.innerHTML = '<div class="panel-empty">Нет household_id — данные не загружены.</div>'; return; }
  [...D.overdue, ...D.upcoming].forEach(it => { BYID[it.id] = it; });
  const oc = D.overdue.length, uc = D.upcoming.length;
  const hero = `<div class="hero"><div class="hero-label">Планы к разбору</div>
    <div class="hero-row">
      <span class="hero-num ${oc?'':''}" style="color:${oc?'var(--yellow)':'var(--green)'}">${oc}</span>
      <span class="hero-cap">${oc?`${plural(oc,'просроченный','просроченных','просроченных')} · ${fmtRub(D.overdue_rub)}`:'нет просроченных'} · впереди ${uc} на ${fmtRub(D.upcoming_rub)}</span>
    </div></div>`;
  root.innerHTML = hero
    + panel('Просрочено', D.overdue, D.overdue_rub, 'overdue')
    + panel('Предстоит', D.upcoming, D.upcoming_rub);
}
render();
document.getElementById('edit-overlay').addEventListener('click', e => { if(e.target.id === 'edit-overlay') closeEdit(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeEdit(); });
</script>
</body>
</html>
